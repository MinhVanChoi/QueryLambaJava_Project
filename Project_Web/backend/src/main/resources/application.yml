server:
  port: 8080

spring:
  application:
    name: fastfood-mis-backend

  datasource:
    url: ${DATASOURCE_URL:jdbc:h2:mem:fastfood_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
    username: ${DATASOURCE_USERNAME:root}
    password: ${DATASOURCE_PASSWORD:123456789}
    driver-class-name: ${DATASOURCE_DRIVER:org.h2.Driver}

  jpa:
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    show-sql: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: false

# Custom application properties
app:
  seed-on-startup: true